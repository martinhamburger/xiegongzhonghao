<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写作工作区 - 公众号写作助手</title>
    <link rel="stylesheet" href="workspace.css">
</head>
<body>
    <div class="workspace">
        <!-- Header -->
        <header class="workspace-header">
            <div class="header-left">
                <h1>📝 写作工作区</h1>
                <span id="step-indicator" class="step-badge">步骤 1/4</span>
            </div>
            <div class="header-right">
                <button class="btn btn-sm btn-secondary" id="save-btn">💾 保存</button>
                <button class="btn btn-sm btn-secondary" id="back-btn">← 返回</button>
            </div>
        </header>

        <div class="workspace-main">
            <!-- Sidebar - AI Guidance -->
            <aside class="sidebar">
                <div class="guidance-panel">
                    <h2>🤖 AI 助手</h2>
                    <div id="guidance-content" class="guidance-text">
                        <p>准备开始写作...</p>
                    </div>
                </div>

                <div class="progress-panel">
                    <h3>写作进度</h3>
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
                    </div>
                    <p id="progress-text">0% 完成</p>
                </div>

                <div class="tips-panel">
                    <h3>💡 写作提示</h3>
                    <ul id="tips-list">
                        <li>用自己的话解释概念</li>
                        <li>加入图解或比喻</li>
                        <li>记录个人感悟</li>
                    </ul>
                </div>
            </aside>

            <!-- Main Editor -->
            <main class="editor-area">
                <div class="article-meta">
                    <input 
                        type="text" 
                        id="article-title" 
                        class="title-input" 
                        placeholder="文章标题..."
                    />
                    <input 
                        type="text" 
                        id="article-subtitle" 
                        class="subtitle-input" 
                        placeholder="副标题（可选）..."
                    />
                </div>

                <!-- Step 1: Core Idea -->
                <div class="step-content" id="step-1" style="display: none;">
                    <h2>步骤 1：确定核心观点</h2>
                    
                    <div class="question-block">
                        <label>1. 本文最核心的观点是什么？（一句话概括）</label>
                        <textarea id="core-idea" rows="3" placeholder="在此输入你的核心观点..."></textarea>
                    </div>

                    <div class="question-block">
                        <label>2. 写这篇文章的动机是什么？为什么想写这个主题？</label>
                        <textarea id="motivation" rows="4" placeholder="在此输入你的写作动机..."></textarea>
                    </div>

                    <div class="question-block">
                        <label>3. 读者能从中获得什么？</label>
                        <textarea id="reader-value" rows="3" placeholder="在此输入读者的收获..."></textarea>
                    </div>

                    <div class="step-actions">
                        <button class="btn btn-primary" id="step1-next">下一步 →</button>
                    </div>
                </div>

                <!-- Step 2: Outline -->
                <div class="step-content" id="step-2" style="display: none;">
                    <h2>步骤 2：设计大纲</h2>
                    
                    <div class="outline-editor">
                        <div class="outline-template">
                            <h3>建议大纲结构</h3>
                            <div id="outline-preview"></div>
                        </div>

                        <div class="outline-input">
                            <label>编辑大纲（Markdown格式）</label>
                            <textarea id="outline-text" rows="15" placeholder="## 00 引言&#10;- 写作动机&#10;- 本文目标&#10;&#10;## 01 核心概念&#10;### 1.1 定义/定理&#10;### 1.2 图解/直觉&#10;### 1.3 小结"></textarea>
                        </div>
                    </div>

                    <div class="step-actions">
                        <button class="btn btn-secondary" id="step2-prev">← 上一步</button>
                        <button class="btn btn-primary" id="step2-next">确认大纲 →</button>
                    </div>
                </div>

                <!-- Step 3: Write Sections -->
                <div class="step-content" id="step-3" style="display: none;">
                    <h2>步骤 3：逐章撰写</h2>
                    
                    <div class="section-selector">
                        <label>选择要撰写的章节：</label>
                        <select id="section-select">
                            <option value="">选择章节...</option>
                        </select>
                    </div>

                    <div class="writing-area">
                        <div class="section-guidance" id="section-guidance">
                            <p>选择一个章节开始撰写</p>
                        </div>

                        <textarea 
                            id="section-content" 
                            rows="20" 
                            placeholder="在此撰写章节内容...&#10;&#10;建议结构：&#10;### 定义/定理&#10;> [标准表达]&#10;&#10;### 直觉/图解&#10;[用自己的话解释]&#10;&#10;### 小结&#10;[一句话概括]"
                        ></textarea>
                    </div>

                    <div class="step-actions">
                        <button class="btn btn-secondary" id="step3-prev">← 上一步</button>
                        <button class="btn btn-success" id="save-section">保存章节</button>
                        <button class="btn btn-primary" id="step3-next">进入润色 →</button>
                    </div>
                </div>

                <!-- Step 4: Polish -->
                <div class="step-content" id="step-4" style="display: none;">
                    <h2>步骤 4：整体润色</h2>
                    
                    <div class="polish-options">
                        <button class="btn btn-block" id="check-logic">🔍 检查逻辑连贯性</button>
                        <button class="btn btn-block" id="check-style">🎨 检查风格统一性</button>
                        <button class="btn btn-block" id="remove-ai-style">✨ 应用去AI味优化</button>
                    </div>

                    <div class="full-article">
                        <label>完整文章预览</label>
                        <textarea 
                            id="full-content" 
                            rows="25"
                            placeholder="文章内容将在此显示..."
                        ></textarea>
                    </div>

                    <div class="polish-results" id="polish-results" style="display: none;">
                        <h3>优化建议</h3>
                        <div id="polish-suggestions"></div>
                    </div>

                    <div class="step-actions">
                        <button class="btn btn-secondary" id="step4-prev">← 上一步</button>
                        <button class="btn btn-success" id="finish-article">✅ 完成文章</button>
                    </div>
                </div>
            </main>

            <!-- Right Panel - Preview -->
            <aside class="preview-panel">
                <div class="panel-header">
                    <h3>实时预览</h3>
                    <button class="btn-icon" id="toggle-preview">👁️</button>
                </div>
                <div id="live-preview" class="preview-content">
                    <p class="placeholder">开始写作后，预览将显示在此</p>
                </div>
            </aside>
        </div>

        <!-- Status Bar -->
        <footer class="status-bar">
            <div class="status-left">
                <span id="word-count">字数: 0</span>
                <span id="last-saved">未保存</span>
            </div>
            <div class="status-right">
                <span id="status-message">就绪</span>
            </div>
        </footer>
    </div>

    <script src="workspace.js"></script>
</body>
</html>
